name: QA Reports

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qa-reports-pages
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install k6
        id: k6_install
        continue-on-error: true
        run: |
          set -e
          sudo gpg -k
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          k6 version

      - name: Playwright (web E2E)
        id: web
        continue-on-error: true
        run: npm run test:web
        env:
          CI: true

      - name: Build and start backend (API suites)
        run: |
          npm run build -w backend
          AI_PROVIDER=mock NODE_ENV=production PORT=3001 npm run start -w backend &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/health >/dev/null; then
              echo "Backend OK"
              exit 0
            fi
            sleep 2
          done
          echo "Backend no respondió en :3001"
          exit 1
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Newman (API)
        id: newman
        continue-on-error: true
        run: npm run test:api-postman

      - name: Pact contracts
        id: pact
        continue-on-error: true
        run: npm run test:contract

      - name: k6 load
        id: k6
        continue-on-error: true
        if: steps.k6_install.outcome == 'success'
        run: npm run test:load
        env:
          API_URL: http://127.0.0.1:3001

      - name: AI evals + LLM judge
        id: ai
        continue-on-error: true
        run: |
          mkdir -p tests/ai-evals/reports
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "Sin OPENROUTER_API_KEY — publicando placeholder en Pages"
            npx tsx tests/ai-evals/write-ci-missing-key-report.ts
            exit 0
          fi
          set +e
          echo "Ejecutando test:ai ..."
          npm run test:ai
          AI_EVALS_EXIT=$?
          echo "Ejecutando test:ai:judge ..."
          npm run test:ai:judge
          AI_JUDGE_EXIT=$?
          ls -la tests/ai-evals/reports || true
          if [ "$AI_EVALS_EXIT" -ne 0 ] || [ "$AI_JUDGE_EXIT" -ne 0 ]; then
            echo "AI suites con fallos (evals=$AI_EVALS_EXIT judge=$AI_JUDGE_EXIT) — HTML se publica igual si existen"
            exit 1
          fi
          exit 0
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: nvidia/nemotron-3.5-lightning:free
          OPENROUTER_JUDGE_MODEL: nvidia/nemotron-3.5-lightning:free
          OPENROUTER_FALLBACK_MODELS: liquid/lfm-2.5-2.6b:free,thinkingmachines/inkling-small:free
          OPENROUTER_MAX_RETRIES: '3'
          OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
          OPENROUTER_SITE_URL: https://smart-shop-lab-web-frontend.vercel.app
          OPENROUTER_APP_NAME: SmartShopLab-AI-Evals-CI

      - name: Build reports site
        run: npx tsx tests/build-reports-site.ts

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload reports zip (Actions Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-html-reports
          path: reports-site
          retention-days: 14

      - name: Fail if critical suites failed
        if: steps.web.outcome == 'failure' || steps.newman.outcome == 'failure' || steps.pact.outcome == 'failure'
        run: |
          echo "Falló alguna suite crítica (web/newman/pact). Los reportes igual se publicaron en Pages."
          exit 1
