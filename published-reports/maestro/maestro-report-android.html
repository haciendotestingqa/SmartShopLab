<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartShopLab — Maestro Android</title>
  <style>

    :root {
      --neon-pink: #f714aa;
      --neon-orange: #f97b3a;
      --neon-yellow: #f9d20c;
      --lab-dark: #0a0912;
      --lab-bg: #F8F7FC;
      --lab-text: #000000;
      --lab-muted: #000000;
    }
    body { font-family: Inter, system-ui, sans-serif; margin: 0; background: var(--lab-bg); color: var(--lab-text); }
    header {
      background: var(--lab-dark);
      color: #fff;
      padding: 22px 28px;
      box-shadow: 0 8px 24px rgb(10 9 18 / 45%);
      border-bottom: 3px solid var(--neon-pink);
    }
    header p { margin: 8px 0 0; color: rgb(255 255 255 / 92%); }
    .header-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 16px; min-width: 0; flex: 1; }
    .brand-logo, .brand-mark {
      width: 140px; height: 140px; border-radius: 22px; flex-shrink: 0;
      object-fit: cover; box-shadow: 0 4px 14px rgb(10 9 18 / 35%);
      border: 2px solid rgb(255 255 255 / 55%);
    }
    .brand-mark {
      display: grid; place-items: center; background: var(--lab-dark);
      font-weight: 800; font-size: 14px; letter-spacing: .04em;
    }
    .header-text { min-width: 0; flex: 1; }
    .header-text h1 { margin: 0; font-size: 1.45rem; letter-spacing: -0.02em; }
    .brand-tag {
      display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase; color: var(--neon-yellow);
    }
    .tool-logo { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .tool-logo svg { width: 56px; height: 56px; display: block; filter: drop-shadow(0 2px 6px rgb(0 0 0 / 25%)); }
    .tool-logo--compact svg { width: 36px; height: 36px; }
    .tool-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgb(255 255 255 / 88%); }
    main { padding: 24px 32px 48px; max-width: 1100px; color: #000; }
    main h1, main h2, main h3, main p, main td, main th, main pre, main code, main a, main .empty, main .note {
      color: #000;
    }
    .badge { display: inline-block; background: var(--status, #16a34a); color: white; padding: 4px 12px; border-radius: 999px; font-weight: 700; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; background: white; border-radius: 12px; box-shadow: 0 1px 3px rgb(15 23 42 / 8%); border: 1px solid rgb(247 20 170 / 12%); overflow: visible; }
    th, td { text-align: left; padding: 12px 16px; vertical-align: top; border-bottom: 1px solid #e2e8f0; color: #000 !important; }
    thead th, th {
      background: #d8d8de !important;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: #000 !important;
      border-bottom: 1px solid #c4c4cc;
      box-shadow: 0 6px 14px rgb(10 9 18 / 18%);
    }
    thead th:first-child { border-top-left-radius: 12px; }
    thead th:last-child { border-top-right-radius: 12px; }
    pre { white-space: pre-wrap; margin: 0; font-size: 13px; color: #000; }

    :root { --status: #dc2626; }
  </style>
</head>
